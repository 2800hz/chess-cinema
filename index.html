<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess Cinema</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }
    h1 { font-size: 2rem; letter-spacing: 0.05em; margin-bottom: 24px; color: #f0d9b5; }

    /* Menu */
    #menu { width: 100%; max-width: 520px; }
    .game-btn { display: block; width: 100%; margin-bottom: 14px; padding: 16px 20px; background: #16213e; border: 1px solid #444; border-radius: 8px; color: #eee; cursor: pointer; text-align: left; transition: background 0.2s, border-color 0.2s; }
    .game-btn:hover { background: #0f3460; border-color: #f0d9b5; }
    .game-btn .title { font-size: 1.1rem; font-weight: bold; margin-bottom: 4px; color: #f0d9b5; }
    .game-btn .meta { font-size: 0.85rem; color: #aaa; }

    /* Game view */
    #game { display: none; width: 100%; max-width: 900px; flex-direction: column; }
    #back-row { margin-bottom: 14px; }
    #backBtn { background: none; border: 1px solid #666; color: #aaa; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    #backBtn:hover { border-color: #f0d9b5; color: #f0d9b5; }
    #hdr-title { font-size: 1.4rem; font-weight: bold; color: #f0d9b5; margin-bottom: 4px; }
    #hdr-players { font-size: 0.9rem; color: #aaa; margin-bottom: 6px; }
    #hdr-desc { font-size: 0.88rem; color: #ccc; margin-bottom: 18px; line-height: 1.5; }

    .layout { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }

    /* Chessground board */
    #board { width: 480px; height: 480px; flex-shrink: 0; }

    /* Sidebar */
    .sidebar { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 12px; }
    #status { font-size: 0.9rem; color: #ccc; min-height: 1.2em; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    .controls button { padding: 8px 14px; border: 1px solid #555; border-radius: 4px; background: #16213e; color: #eee; cursor: pointer; font-size: 0.9rem; }
    .controls button:hover:not(:disabled) { background: #0f3460; border-color: #f0d9b5; }
    .controls button:disabled { opacity: 0.4; cursor: default; }
    #move-list { display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; overflow-y: auto; max-height: 380px; }
    .move-chip { font-size: 0.82rem; padding: 3px 7px; border-radius: 3px; background: #16213e; border: 1px solid #333; white-space: nowrap; }
    .move-chip.active { background: #0f3460; border-color: #f0d9b5; color: #f0d9b5; }
  </style>
  <script type="module" crossorigin src="/chess-cinema/assets/index-3c05f134.js"></script>
  <link rel="stylesheet" href="/chess-cinema/assets/index-cd82b5f2.css">
</head>
<body>
  <h1>Chess Cinema</h1>

  <div id="menu">
    <div id="game-cards"></div>
  </div>

  <div id="game">
    <div id="back-row"><button id="backBtn">&#8592; Menu</button></div>
    <div id="hdr-title"></div>
    <div id="hdr-players"></div>
    <div id="hdr-desc"></div>
    <div class="layout">
      <div id="board" class="cg-wrap"></div>
      <div class="sidebar">
        <div id="status"></div>
        <div class="controls">
          <button id="playBtn">&#9654; Play</button>
          <button id="stepBtn">&#9654;| Step</button>
          <button id="resetBtn">&#8635; Reset</button>
        </div>
        <div id="move-list"></div>
      </div>
    </div>
  </div>

  
</body>
</html>
